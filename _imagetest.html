<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { background:#111; color:#eee; font:13px monospace; margin:0; padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  figure { margin:0; background:#222; }
  img { width:100%; height:150px; object-fit:cover; display:block; background:#444; }
  figcaption { padding:4px 6px; font-size:11px; word-break:break-all; }
  .bad { color:#f66; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>

const g = document.getElementById('g');
ids.forEach(id => {

  const c = document.createElement('figcaption');
  c.textContent = id;
  f.appendChild(img); f.appendChild(c);
  g.appendChild(f);
});
</script>
</body>
</html>
